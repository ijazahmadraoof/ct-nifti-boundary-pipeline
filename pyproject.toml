[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-nifti-boundary-pipeline"
version = "0.1.0"
description = "CT/NIfTI processing and boundary-surface extraction for engineering simulation workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3.0",
    "nibabel>=5.3,<6.0",
]

[tool.setuptools.packages.find]
where = ["src"]